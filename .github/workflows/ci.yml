name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests examples

      - name: Run offline tests
        run: python -m pytest -m "not live and not slow"

      - name: Run Quick Start smoke test
        run: |
          python examples/minimal_synthetic.py | tee quick-start-output.txt
          grep -q "status: ok" quick-start-output.txt
          grep -q "live_data: false" quick-start-output.txt

      - name: Build and validate package artifacts
        run: |
          rm -rf dist package-smoke-env
          python -m build
          python -m twine check dist/*
          python -m venv package-smoke-env
          package-smoke-env/bin/python -m pip install --upgrade pip
          package-smoke-env/bin/python -m pip install dist/*.whl
          package-smoke-env/bin/python -c "import quant; assert quant.__version__ == '0.1.1'"
          package-smoke-env/bin/quant --help
