run_id: "zhixu-rank-research"
simulation_only: true
features_file: "features.parquet"
bars_file: "bars.parquet"
sector_metadata_file: "rolling_predictions_daily_sector.parquet"
baseline_prediction_file: "rolling_predictions_daily_sector.parquet"
prediction_file: "zhixu_rank_research_predictions.parquet"
report_file: "zhixu-rank-research.json"
artifact_directory: "zhixu-rank-research"

history_start: "2010-01-01"
research_start: "2014-01-01"
outer_start: "2016-01-01"
outer_end: "2026-07-27"
development_end: "2023-12-31"
known_stress_start: "2024-01-01"
horizons: [5, 10, 20]
selection_label_horizon: 10
relevance_grades: 5
minimum_cross_section: 100
inner_selection_months: 12
early_stopping_months: 12
embargo_trading_days: 21
minimum_training_years: 3
top_k: 20
seed: 42

ranker:
  objective: "lambdarank"
  metric: "ndcg"
  eval_at: [10, 20]
  lambdarank_truncation_level: 40
  learning_rate: 0.03
  num_leaves: 31
  max_depth: 6
  min_data_in_leaf: 100
  feature_fraction: 0.80
  bagging_fraction: 0.80
  bagging_freq: 1
  lambda_l1: 1.0
  lambda_l2: 2.0
  max_bin: 127
  num_threads: 3
  num_boost_round: 500
  early_stopping_rounds: 50

candidates:
  - name: "rank5_global"
    horizon_weights: {5: 1.00, 10: 0.00, 20: 0.00}
    neutralization: "global"
  - name: "short_blend_global"
    horizon_weights: {5: 0.50, 10: 0.35, 20: 0.15}
    neutralization: "global"
  - name: "balanced_sector_liquidity"
    horizon_weights: {5: 0.25, 10: 0.50, 20: 0.25}
    neutralization: "sector_liquidity"
  - name: "persistent_sector_liquidity"
    horizon_weights: {5: 0.15, 10: 0.35, 20: 0.50}
    neutralization: "sector_liquidity"

inner_selection:
  minimum_mean_daily_rank_ic: 0.0
  minimum_top_k_mean_excess_return: 0.0
  minimum_positive_rank_ic_fraction: 0.48
  primary_metric: "mean_daily_rank_ic"
  tie_breakers: ["top_k_mean_excess_return", "rank_ic_information_ratio"]

score_mapping:
  probability_floor: 0.25
  probability_ceiling: 0.75
  excess_return_scale: 0.04

