development_start: "2014-01-01"
development_end: "2023-12-31"
locked_start: "2024-01-01"
prediction_file: "rolling_predictions_daily_sector.parquet"
selection:
  maximum_drawdown_floor: -0.25
  primary_metric: "annualized_return"
  tie_breakers:
    - "sharpe_ratio"
    - "calmar_ratio"
locked_acceptance:
  minimum_annualized_return: 0.05
  minimum_sharpe_ratio: 0.50
  maximum_drawdown_floor: -0.25
  minimum_excess_cumulative_return: -0.05
candidates:
  - name: "buffer60_staged_hard_gate"
    exit_rank: 60
    initial_entry_fraction: 0.50
    add_fraction: 0.25
    apply_risk_gate: true
    risk_weight_scales: null
    risk_scale_refresh: "weekly"
  - name: "buffer60_staged_weekly_soft"
    exit_rank: 60
    initial_entry_fraction: 0.50
    add_fraction: 0.25
    apply_risk_gate: false
    risk_scale_refresh: "weekly"
    risk_weight_scales:
      market:
        NORMAL: 1.00
        CAUTIOUS: 0.75
        HIGH_RISK: 0.50
        DATA_UNAVAILABLE: 0.00
      sector:
        NORMAL: 1.00
        CAUTIOUS: 1.00
        HIGH_RISK: 0.75
        DATA_UNAVAILABLE: 0.00
  - name: "buffer60_staged_ungated"
    exit_rank: 60
    initial_entry_fraction: 0.50
    add_fraction: 0.25
    apply_risk_gate: false
    risk_weight_scales: null
    risk_scale_refresh: "weekly"
